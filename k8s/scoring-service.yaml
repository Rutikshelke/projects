apiVersion: apps/v1
kind: Deployment
metadata:
  name: scoring-service
  namespace: fantasy-stock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scoring-service
  template:
    metadata:
      labels:
        app: scoring-service
    spec:
      containers:
        - name: scoring-service
          image: yourdockerhubusername/scoring-service:latest
          ports:
            - containerPort: 4003
          envFrom:
            - secretRef:
                name: scoring-env
---
apiVersion: v1
kind: Service
metadata:
  name: scoring-service
  namespace: fantasy-stock
spec:
  selector:
    app: scoring-service
  ports:
    - port: 4003
      targetPort: 4003
