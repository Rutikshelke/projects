apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: fantasy-stock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: yourdockerhubusername/notification-service:latest
          ports:
            - containerPort: 4004
          envFrom:
            - secretRef:
                name: notification-env
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: fantasy-stock
spec:
  selector:
    app: notification-service
  ports:
    - port: 4004
      targetPort: 4004
