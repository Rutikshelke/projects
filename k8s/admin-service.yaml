apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-service
  namespace: fantasy-stock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-service
  template:
    metadata:
      labels:
        app: admin-service
    spec:
      containers:
        - name: admin-service
          image: yourdockerhubusername/admin-service:latest
          ports:
            - containerPort: 4007
          envFrom:
            - secretRef:
                name: admin-env
---
apiVersion: v1
kind: Service
metadata:
  name: admin-service
  namespace: fantasy-stock
spec:
  selector:
    app: admin-service
  ports:
    - port: 4007
      targetPort: 4007
