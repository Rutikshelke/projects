apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallet-service
  namespace: fantasy-stock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wallet-service
  template:
    metadata:
      labels:
        app: wallet-service
    spec:
      containers:
        - name: wallet-service
          image: yourdockerhubusername/wallet-service:latest
          ports:
            - containerPort: 4001
          envFrom:
            - secretRef:
                name: wallet-env
---
apiVersion: v1
kind: Service
metadata:
  name: wallet-service
  namespace: fantasy-stock
spec:
  selector:
    app: wallet-service
  ports:
    - port: 4001
      targetPort: 4001
