apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: fantasy-stock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: yourdockerhubusername/auth-service:latest
          ports:
            - containerPort: 4000
          envFrom:
            - secretRef:
                name: auth-env
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: fantasy-stock
spec:
  selector:
    app: auth-service
  ports:
    - port: 4000
      targetPort: 4000
