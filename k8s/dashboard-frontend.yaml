apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-frontend
  namespace: fantasy-stock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard-frontend
  template:
    metadata:
      labels:
        app: dashboard-frontend
    spec:
      containers:
        - name: dashboard-frontend
          image: yourdockerhubusername/dashboard-frontend:latest
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-frontend
  namespace: fantasy-stock
spec:
  selector:
    app: dashboard-frontend
  ports:
    - port: 3000
      targetPort: 3000
