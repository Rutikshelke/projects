name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  install-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install root dependencies
        run: npm install

      - name: Lint all packages
        run: npm run lint

  test-services:
    runs-on: ubuntu-latest
    needs: install-and-lint
    strategy:
      matrix:
        service:
          - auth
          - wallet
          - contest
          - scoring
          - notification
          - leaderboard
          - analytics
          - admin-service
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --workspace=services/${{ matrix.service }}

      - name: Run Tests
        run: npm test --workspace=services/${{ matrix.service }}

  test-clients:
    runs-on: ubuntu-latest
    needs: install-and-lint
    strategy:
      matrix:
        client:
          - dashboard
          - admin-panel
          - landing-page
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --workspace=clients/${{ matrix.client }}

      - name: Run Tests
        run: npm test --workspace=clients/${{ matrix.client }}
